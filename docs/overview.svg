<title id="t">heretix-management overview</title><desc id="d">SBOMs from heretix-cli, Trivy, Syft or cdxgen, and network appliances added by hand or by CSV, are imported into heretix-management, which keeps the inventory and the alerts, scans on a schedule by searching heretix-api, and shows the findings to the team.</desc>
