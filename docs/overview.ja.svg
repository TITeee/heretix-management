<title id="t">heretix-management の構成</title><desc id="d">heretix-cli、Trivy、Syft、cdxgen の SBOM と、手動または CSV で登録したネットワーク機器を heretix-management に取り込みます。heretix-management はインベントリとアラートを保持し、heretix-api を検索して定期的にスキャンし、結果を運用チームに示します。</desc>
